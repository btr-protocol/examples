[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "prague"

# The examples read `config/<chainId>.json` from the repo root so that not one address is
# inlined in a .sol file. Foundry sandboxes the filesystem, so the directory has to be declared.
fs_permissions = [{ access = "read", path = "../config" }]

[rpc_endpoints]
# Override with BTR_RPC_URL for a private endpoint. The public one rate limits under load.
btr = "${BTR_RPC_URL}"

[fuzz]
runs = 32
