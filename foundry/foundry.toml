[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "prague"

# PACE THE UPSTREAM. Every cache miss is a request to a public endpoint, and the suite forks per
# test, so an unthrottled run burns through a free tier's limit in seconds and reports the 429s
# as failed tests. A 429 is an UNKNOWN result, never a pass and never a failure. forge reads the
# throttle from its command line, not from this file, and the flags need `--rpc-url`:
#
#   forge test --rpc-url $BTR_RPC_URL --compute-units-per-second 100 \
#     --fork-retries 10 --fork-retry-backoff 2
#
# Lower the first for a stricter endpoint, raise it for a paid one. Pinning `BTR_FORK_BLOCK` (and
# `--fork-block-number` to match) lets forge cache the reads on disk, so a rerun costs no requests.

# The examples read `config/<chainId>.json` from the repo root so that not one address is
# inlined in a .sol file. Foundry sandboxes the filesystem, so the directory has to be declared.
fs_permissions = [{ access = "read", path = "../config" }]

[rpc_endpoints]
# Override with BTR_RPC_URL for a private endpoint. The public one rate limits under load.
btr = "${BTR_RPC_URL}"

[fuzz]
runs = 32
